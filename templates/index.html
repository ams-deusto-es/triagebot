<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6">
    <h1 class="text-3xl font-bold">TriageBot</h1>
    <p class="mt-2 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>

    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">Nuevo ticket</h2>
      <form class="mt-3 space-y-3"
            hx-post="/ui/tickets"
            hx-include="#filters"
            hx-target="#tickets-table"
            hx-swap="innerHTML"
            hx-disabled-elt="find button"
            hx-on:ticket-created="this.reset(); document.getElementById('form-error').innerHTML = ''">
        <div>
          <label for="title" class="block text-sm font-medium">Título</label>
          <input id="title" name="title" type="text" required maxlength="200"
                 class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label for="description" class="block text-sm font-medium">Descripción</label>
          <textarea id="description" name="description" rows="3" required maxlength="5000"
                    class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm"></textarea>
        </div>
        <div id="form-error"></div>
        <div class="flex items-center gap-3">
          <button type="submit"
                  class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 disabled:opacity-50">
            Crear y clasificar
          </button>
          <span class="htmx-indicator text-sm text-slate-500">Clasificando con IA…</span>
        </div>
      </form>
    </section>

    <section class="mt-6">
      <form id="filters" class="flex flex-wrap items-end gap-3"
            hx-get="/ui/tickets"
            hx-trigger="change"
            hx-target="#tickets-table"
            hx-swap="innerHTML">
        <div>
          <label for="filter-category" class="block text-sm font-medium">Categoría</label>
          <select id="filter-category" name="category" class="mt-1 rounded-md border border-slate-300 px-2 py-1 text-sm">
            <option value="">Todas</option>
            {% for value in categories %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="filter-priority" class="block text-sm font-medium">Prioridad</label>
          <select id="filter-priority" name="priority" class="mt-1 rounded-md border border-slate-300 px-2 py-1 text-sm">
            <option value="">Todas</option>
            {% for value in priorities %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="filter-status" class="block text-sm font-medium">Estado</label>
          <select id="filter-status" name="status" class="mt-1 rounded-md border border-slate-300 px-2 py-1 text-sm">
            <option value="">Todos</option>
            {% for value in statuses %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
          </select>
        </div>
      </form>

      <div id="tickets-table" class="mt-4 overflow-x-auto">
        {% include "_tickets_table.html" %}
      </div>
    </section>
  </main>
</body>
</html>

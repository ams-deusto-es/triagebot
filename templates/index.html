<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Also swap 422 responses, so form validation errors are shown. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true,"error":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
    .htmx-request .idle-label { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-7xl p-4 sm:p-6">
    <header>
      <h1 class="text-3xl font-bold">TriageBot</h1>
      <p class="mt-1 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>
    </header>

    <!-- New ticket -->
    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">Nuevo ticket</h2>
      <form class="mt-3 grid gap-3"
            hx-post="/ui/tickets"
            hx-target="#form-feedback"
            hx-disabled-elt="find button"
            hx-on::after-request="if (event.detail.successful) this.reset()">
        <label class="grid gap-1 text-sm font-medium">
          Título
          <input name="title" required maxlength="200"
                 class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </label>
        <label class="grid gap-1 text-sm font-medium">
          Descripción
          <textarea name="description" required maxlength="5000" rows="3"
                    class="rounded-md border border-slate-300 px-3 py-2 font-normal focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
        </label>
        <div class="flex flex-wrap items-center gap-3">
          <button type="submit"
                  class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 disabled:cursor-wait disabled:opacity-60">
            <span class="idle-label">Crear y clasificar</span>
            <span class="htmx-indicator">Clasificando con IA…</span>
          </button>
          <div id="form-feedback" class="text-sm"></div>
        </div>
      </form>
    </section>

    <!-- Filters -->
    <section class="mt-6">
      <form id="filters" class="flex flex-wrap items-end gap-3"
            hx-get="/ui/tickets" hx-target="#tickets"
            hx-trigger="change, reset delay:10ms">
        {% for name, label, values in [
          ("category", "Categoría", categories),
          ("priority", "Prioridad", priorities),
          ("status", "Estado", statuses),
        ] %}
        <label class="grid gap-1 text-sm font-medium">
          {{ label }}
          <select name="{{ name }}" class="rounded-md border border-slate-300 bg-white px-3 py-2 font-normal">
            <option value="">Todas</option>
            {% for v in values %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
          </select>
        </label>
        {% endfor %}
        <button type="reset" class="rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100">Limpiar filtros</button>
      </form>
    </section>

    <!-- Board: reloads on filter change and when a ticket is created -->
    <section id="tickets" class="mt-4"
             hx-get="/ui/tickets" hx-include="#filters"
             hx-trigger="tickets-changed from:body">
      {% include "_tickets_table.html" %}
    </section>
  </main>
</body>
</html>

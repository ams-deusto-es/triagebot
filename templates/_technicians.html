{% if error %}
<p class="mb-2 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
{% endif %}
<div class="flex flex-wrap gap-1">
  {% for technician in technicians %}
  <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-700">{{ technician.name }}</span>
  {% else %}
  <span class="text-sm text-slate-500">Todavía no hay técnicos dados de alta.</span>
  {% endfor %}
</div>
